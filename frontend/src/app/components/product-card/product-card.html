<article class="card h-100 border-0 shadow-sm">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
      <h2 class="h5 card-title mb-0">{{ product.name }}</h2>
      <span class="badge text-bg-light">{{ product.category }}</span>
    </div>
    <p class="card-text text-body-secondary flex-grow-1">{{ product.description }}</p>
    <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
      <span class="fs-5 fw-semibold text-primary">€{{ product.price }}</span>
      <span class="small text-body-secondary">Disponibili: {{ product.quantity }}</span>
    </div>
    <button class="btn btn-outline-danger btn-sm align-self-start" type="button" (click)="onDelete()">
      Elimina
    </button>
  </div>
</article>
